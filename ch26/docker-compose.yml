services:
  backend:
    build: ./backend
    container_name: mathgraph-backend
    ports:
      - "8080:8080"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中配置 DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DATABASE_PATH: /app/data/math_graph_ai.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/sessions"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    container_name: mathgraph-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
